{% extends 'base.html' %}
{% block title %}Buy {{ stock.symbol }}{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center">
    <div class="max-w-lg w-full bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">
            Buy Stock
        </h2>
        <div class="mt-4 text-center">
            <p class="text-xl font-bold text-blue-600">{{ stock.symbol }}</p>
            <p class="text-lg text-gray-700">{{ stock.name }}</p>
            <p class="mt-2 text-3xl font-bold text-gray-900">₹{{ stock.current_price|floatformat:2 }}</p>
        </div>
        
        <form class="mt-8 space-y-6" method="POST">
            {% csrf_token %}
            <div>
                <label for="quantity" class="block text-sm font-medium text-gray-700">Quantity</label>
                <input id="quantity" name="quantity" type="number" min="1" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., 10">
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Confirm Purchase
                </button>
            </div>
             <div class="text-center">
                <a href="{% url 'dashboard' %}" class="text-sm font-medium text-gray-600 hover:text-blue-500">
                    &larr; Back to Market
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
