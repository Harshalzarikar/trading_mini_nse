{% extends 'base.html' %}
{% block title %}Add New Stock{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center">
    <div class="max-w-lg w-full bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">
            Add New Stock to Market
        </h2>
        <p class="text-center mt-2 text-sm text-gray-600">This form is available to administrators only.</p>
        
        <form class="mt-8 space-y-4" method="POST">
            {% csrf_token %}
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Stock Name</label>
                <input id="name" name="name" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., Reliance Industries">
            </div>
            <div>
                <label for="symbol" class="block text-sm font-medium text-gray-700">Symbol</label>
                <input id="symbol" name="symbol" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., RELIANCE">
            </div>
            <div>
                <label for="price" class="block text-sm font-medium text-gray-700">Current Price (₹)</label>
                <input id="price" name="price" type="number" step="0.01" min="0.01" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., 2850.50">
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Add Stock
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
